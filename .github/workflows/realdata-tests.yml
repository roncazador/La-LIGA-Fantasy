name: Real data tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  realdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check config.mjs
          node --check providers.mjs
          node --check realdata.mjs
      - name: Run provider and Render-like QA
        run: node qa.test.mjs
