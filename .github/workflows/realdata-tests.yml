name: Real data tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  realdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 100 real-data checks
        run: node realdata.test.mjs
