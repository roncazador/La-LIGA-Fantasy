name: Sync frontend version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate brain engine
        shell: bash
        run: |
          set -euo pipefail
          node --check brain-engine.js

      - name: Sync index.html version and brain engine
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const file = './index.html';
          let html = fs.readFileSync(file, 'utf8');
          const version = `v${pkg.version}`;
          html = html.replace(/v\d+\.\d+(?:\.\d+)?/g, version);

          const brain = fs.readFileSync('./brain-engine.js', 'utf8');
          const markerStart = '<!-- BRAIN_ENGINE_V2_START -->';
          const markerEnd = '<!-- BRAIN_ENGINE_V2_END -->';
          const block = `${markerStart}<script>${brain}</script>${markerEnd}`;
          const blockRegex = new RegExp(`${markerStart}[\\s\\S]*?${markerEnd}`, 'm');
          if (blockRegex.test(html)) {
            html = html.replace(blockRegex, block);
          } else {
            html = html.replace('</body>', `  ${block}\\n</body>`);
          }

          html = html.replace('<th>J+1</th>\\n          <th>J+2</th>\\n          <th>Mercado</th>', '<th>Conf.</th>\\n          <th>Decisión</th>\\n          <th>Precio</th>');
          fs.writeFileSync(file, html);
          NODE
          git diff --check

      - name: Commit synchronized frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Frontend already synchronized."
            exit 0
          fi
          git add index.html
          git commit -m "ci: integrar cerebro v2 en frontend"
          git push
