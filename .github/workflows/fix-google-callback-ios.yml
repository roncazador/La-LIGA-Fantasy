name: Fix Google callback on iPhone
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch OAuth callback and mobile UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server.mjs')
          s = p.read_text()

          old = "sessions.set(sessionId,{createdAt:Date.now(),state,verifier,platform:'web'});"
          new = "sessions.set(sessionId,{createdAt:Date.now(),state,verifier,platform:'web',redirectUri:'https://jwt.ms'});"
          if old not in s:
              raise SystemExit('server start session pattern not found')
          s = s.replace(old, new, 1)

          old = """      const query = new URLSearchParams({p:config.laligaSigninPolicy,client_id:config.laligaOAuthClientId,response_type:'code',redirect_uri:config.laligaRedirectUri,scope:'openid offline_access',code_challenge:challenge,code_challenge_method:'S256',state,nonce:state});"""
          new = """      const query = new URLSearchParams({p:config.laligaSigninPolicy,client_id:config.laligaOAuthClientId,response_type:'code',response_mode:'query',redirect_uri:'https://jwt.ms',scope:'openid offline_access',code_challenge:challenge,code_challenge_method:'S256',state,nonce:state});"""
          if old not in s:
              raise SystemExit('server authorize query pattern not found')
          s = s.replace(old, new, 1)

          old = """      const redirectUrl = typeof body?.redirectUrl === 'string' ? body.redirectUrl.trim() : '';
      if (!redirectUrl || !redirectUrl.startsWith('authredirect://com.lfp.laligafantasy')) return sendJson(res,400,{error:'INVALID_REDIRECT_URL'});
      let parsed;
      try { parsed = new URL(redirectUrl); } catch { return sendJson(res,400,{error:'INVALID_REDIRECT_URL'});
      const code = parsed.searchParams.get('code');"""
          # The production source has a one-line try/catch, so use the exact compact form instead.
          if old in s:
              pass
          else:
              old = """      const redirectUrl = typeof body?.redirectUrl === 'string' ? body.redirectUrl.trim() : '';
      if (!redirectUrl || !redirectUrl.startsWith('authredirect://com.lfp.laligafantasy')) return sendJson(res,400,{error:'INVALID_REDIRECT_URL'});
      let parsed;
      try { parsed = new URL(redirectUrl); } catch { return sendJson(res,400,{error:'INVALID_REDIRECT_URL'}); }
      const code = parsed.searchParams.get('code');"""
              new = """      const redirectUrl = typeof body?.redirectUrl === 'string' ? body.redirectUrl.trim() : '';
      let parsed;
      try { parsed = new URL(redirectUrl); } catch { return sendJson(res,400,{error:'INVALID_REDIRECT_URL'}); }
      if (parsed.origin !== 'https://jwt.ms') return sendJson(res,400,{error:'INVALID_REDIRECT_URL'});
      const code = parsed.searchParams.get('code');"""
              if old not in s:
                  raise SystemExit('server finish redirect pattern not found')
              s = s.replace(old, new, 1)

          old = "redirect_uri:config.laligaRedirectUri,code_verifier:session.verifier,scope:'openid offline_access'"
          new = "redirect_uri:'https://jwt.ms',code_verifier:session.verifier,scope:'openid offline_access'"
          if old not in s:
              raise SystemExit('server token exchange redirect pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          q = Path('connection-client.js')
          c = q.read_text()
          start = c.index("  async function startGoogle() {")
          end = c.index("  async function finishGoogle() {", start)
          replacement = r'''  async function startGoogle() {
    setBadge('Preparando Google…', 'yellow'); setWarning('');
    setText('connectionDetailsV212', 'Preparando el inicio de sesión oficial de LALIGA…');
    try {
      const data = await getJson('/api/auth/google/start');
      if (!data?.authorizeUrl) throw new Error('AUTH_URL_MISSING');
      sessionStorage.setItem('laliga_google_login_pending', '1');
      setBadge('Abriendo Google…', 'yellow');
      setText('connectionDetailsV212', 'Inicia sesión con Google. Al terminar, LALIGA volverá a jwt.ms; copia la URL completa de Safari y vuelve aquí.');
      window.location.assign(data.authorizeUrl);
    } catch (error) {
      const message = error?.message || 'UNKNOWN_ERROR'; setBadge('Error Google', 'red');
      if (message === 'REQUEST_TIMEOUT') setWarning('El servidor tardó demasiado. Recarga la página e inténtalo de nuevo.');
      else if (message === 'AUTH_URL_MISSING') setWarning('El servidor no devolvió la URL oficial de acceso.');
      else setWarning(`No se pudo preparar el acceso Google (${message}).`);
    }
  }
'''
          c = c[:start] + replacement + c[end:]
          c = c.replace('si LALIGA devuelve una URL que empieza por <b>authredirect://com.lfp.laligafantasy</b>, pégala aquí. Solo contiene el código temporal de acceso.', 'al terminar el acceso, copia aquí la <b>URL completa de jwt.ms</b> (incluye <code>?code=…&state=…</code>). No pegues un token decodificado.')
          c = c.replace('placeholder="authredirect://com.lfp.laligafantasy?code=…&state=…"', 'placeholder="https://jwt.ms/?code=…&state=…"')
          q.write_text(c)

          p = Path('README.md')
          r = p.read_text()
          r += "\n\n### Google en iPhone\nEl cliente oficial no acepta el dominio Render como redirect URI. El flujo web utiliza `https://jwt.ms` como puente de prueba cuando ese URI está registrado para el cliente, y el usuario debe copiar la URL completa de retorno a la aplicación. No se almacenan tokens en el navegador.\n"
          p.write_text(r)
          PY
      - name: Run syntax checks
        run: |
          node --check server.mjs
          node --check connection-client.js
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.mjs connection-client.js README.md .github/workflows/fix-google-callback-ios.yml
          git commit -m 'Fix Google browser callback bridge' || exit 0
          git rm .github/workflows/fix-google-callback-ios.yml || true
          git commit -m 'Remove one-shot OAuth callback workflow' || true
          git push
