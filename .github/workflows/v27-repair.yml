name: v2.12 repair and 10000 regression gate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply calendar, brain and UI repair once
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def add_once(path, needle, insertion, label):
              p=Path(path); s=p.read_text()
              if insertion not in s:
                  if needle not in s: raise SystemExit(f'{label}: needle not found')
                  s=s.replace(needle, insertion+needle, 1)
                  p.write_text(s)
                  print('patched', path, label)

          # Backend: static assets + backwards-compatible fixture route + v27 app loader.
          p=Path('server.mjs'); s=p.read_text()
          old="""    'connection-client.js':'text/javascript; charset=utf-8',"""
          new=old+"\n    'brain-engine-v27.js':'text/javascript; charset=utf-8',\n    'app-shell-v27.js':'text/javascript; charset=utf-8',"
          if "'brain-engine-v27.js'" not in s:
              s=s.replace(old,new,1)
          old_loader="""  if (file === 'index.html' && !content.includes('connection-client.js')) {\n    const loader = '\\n<script src=\"/connection-client.js\" defer></script>\\n';\n    content = content.includes('</body>') ? content.replace('</body>', `${loader}</body>`) : `${content}${loader}`;\n  }"""
          new_loader="""  if (file === 'index.html') {\n    const scripts = ['/connection-client.js','/brain-engine-v27.js','/app-shell-v27.js'];\n    const loader = scripts.filter(src => !content.includes(`src=\"${src}\"`)).map(src => `\\n<script src=\"${src}\" defer></script>\\n`).join('');\n    if (loader) content = content.includes('</body>') ? content.replace('</body>', `${loader}</body>`) : `${content}${loader}`;\n  }"""
          if old_loader in s:
              s=s.replace(old_loader,new_loader,1)
          route="""    if (url.pathname === '/api/fixtures' && req.method === 'GET') return sendJson(res,200,await fetchMultiProviderFixtures(config));\n"""
          alias=route+"    if (url.pathname === '/api/fixtures/next' && req.method === 'GET') return sendJson(res,200,await fetchMultiProviderFixtures(config));\n"
          if "url.pathname === '/api/fixtures/next'" not in s:
              if route not in s: raise SystemExit('fixture route needle not found')
              s=s.replace(route,alias,1)
          p.write_text(s)

          # Public static allowlist.
          p=Path('config.mjs'); s=p.read_text()
          old="""    '/dashboard-client.js', '/calendar-client.js', '/data-client.js',"""
          new=old+" 'brain-engine-v27.js', '/app-shell-v27.js',"
          if "'/app-shell-v27.js'" not in s:
              if old not in s: raise SystemExit('config static needle not found')
              s=s.replace(old,new,1)
          p.write_text(s)

          # Calendar client: use the real unified backend route; keep legacy compatibility on server too.
          p=Path('calendar-client.js'); s=p.read_text()
          s=s.replace("fetch('/api/fixtures/next'", "fetch('/api/fixtures'")
          s=s.replace("status.innerHTML = `✅ ${ordered.length} partidos cargados · fuente principal: <b>${esc(meta.sourceLabel)}</b>", "status.innerHTML = `✅ ${ordered.length} partidos · fuente principal: <b>${esc(meta.sourceLabel)}</b>")
          p.write_text(s)

          # Legacy seed button must point to the real seed, never to the removed J2 file.
          p=Path('index.html'); s=p.read_text()
          s=s.replace('"/fixtures_seed_j2_2026-27.json"', '"/official-fixtures-seed-2026-27.json"')
          s=s.replace('Calendario oficial semilla cargado · Jornada 2.', 'Calendario oficial verificado cargado.')
          p.write_text(s)

          # Version contract.
          p=Path('config.mjs'); s=p.read_text(); s=s.replace("export const VERSION = '2.11.1';", "export const VERSION = '2.12.0';",1); p.write_text(s)
          p=Path('package.json'); data=json.loads(p.read_text()); data['version']='2.12.0'; data['scripts']['test']='node qa.test.mjs && node qa-10000.test.mjs'; p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Install v2.12 brain
        run: |
          cat > brain-engine-v27.js <<'EOF'
          (() => {
            'use strict';
            const finite = v => Number.isFinite(Number(v)) ? Number(v) : null;
            const clamp = (v,a=0,b=100) => Math.max(a,Math.min(b,finite(v) ?? a));
            const norm = v => String(v ?? '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
            const arr = v => Array.isArray(v) ? v : Array.isArray(v?.data) ? v.data : Array.isArray(v?.items) ? v.items : [];
            const money = v => finite(v) === null ? '—' : new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(Number(v))+' €';
            function playerName(p){ return String(p?.name ?? p?.playerName ?? p?.fullName ?? p?.player?.name ?? '').trim(); }
            function position(p){ const x=norm(p?.position ?? p?.positionName ?? p?.role); if(['gk','por','portero'].includes(x)) return 'POR'; if(['df','def','defensa'].includes(x)) return 'DEF'; if(['mf','med','medio','mediocentro','cen'].includes(x)) return 'MED'; if(['fw','del','delantero'].includes(x)) return 'DEL'; return x.toUpperCase(); }
            function extractPlayers(dashboard){
              const team=dashboard?.team?.data ?? dashboard?.team ?? {};
              const raw=arr(team?.players).length?arr(team.players):arr(team?.squad).length?arr(team.squad):arr(team?.members);
              return raw.map(p=>({...p,name:playerName(p),position:position(p),points:finite(p?.points ?? p?.pfsy ?? p?.fantasyPoints ?? p?.score) ?? 0,starts:finite(p?.starts) ?? 0,minutes:finite(p?.minutes) ?? 0,price:finite(p?.price ?? p?.marketPrice ?? p?.currentPrice ?? p?.value),value:finite(p?.value ?? p?.marketValue ?? p?.estimatedValue),injuryRisk:clamp((finite(p?.injuryRisk) ?? 0)*100),rotationRisk:clamp((finite(p?.rotationRisk) ?? 0)*100),availability:p?.availability ?? p?.status ?? ''})).filter(p=>p.name);
            }
            function scorePlayer(p, fixture=50){
              const performance=clamp((p.points*4)*0.68 + clamp(p.minutes/90*20)*0.18 + clamp(p.starts*5)*0.14);
              const availability=norm(p.availability).includes('suspend')?0:clamp(55 + p.minutes/9*0.25 + p.starts*5*0.2);
              const market=(p.value>0&&p.price>0)?clamp(50+((p.value-p.price)/p.value)*100):50;
              const risk=clamp(100-(p.rotationRisk*0.65+p.injuryRisk*0.35));
              const context=clamp(fixture);
              const score=Math.round(clamp(performance*.34+availability*.21+context*.20+market*.15+risk*.10));
              const confidence=Math.round(clamp(35 + (p.points?15:0)+(p.minutes?10:0)+(p.price?10:0)+(p.value?10:0)+(p.starts?10:0),0,100));
              return {score,confidence,performance,availability,context,market,risk};
            }
            function fixtureForTeam(team, fixtures){
              const key=norm(team).replace(/\b(fc|cf|sd|ud|real|club|rcd|ca|deportivo)\b/g,'').replace(/[^a-z0-9]/g,'');
              const fs=arr(fixtures).filter(f=>{const h=norm(f.home||f.homeTeam?.name).replace(/\b(fc|cf|sd|ud|real|club|rcd|ca|deportivo)\b/g,'').replace(/[^a-z0-9]/g,'');const a=norm(f.away||f.awayTeam?.name).replace(/\b(fc|cf|sd|ud|real|club|rcd|ca|deportivo)\b/g,'').replace(/[^a-z0-9]/g,''); return key&& (h===key||a===key);}).sort((a,b)=>new Date(a.utcDate||a.date||0)-new Date(b.utcDate||b.date||0));
              const f=fs[0]; return f ? 50 : 50;
            }
            function extractMarket(dashboard){ return arr(dashboard?.market).length ? arr(dashboard.market) : arr(dashboard?.market?.data); }
            function analyze({dashboard={},fixtures=[]}={}){
              const players=extractPlayers(dashboard).map(p=>{const d=scorePlayer(p,fixtureForTeam(p.team?.name||p.team||p.clubName,fixtures)); return {...p,...d};}).sort((a,b)=>b.score-a.score);
              const listings=extractMarket(dashboard).map(l=>{const value=finite(l?.value ?? l?.marketValue ?? l?.estimatedValue),price=finite(l?.price ?? l?.marketPrice ?? l?.currentPrice);const margin=value>0&&price>0?(value-price)/value:null;const pseudo={...l,points:finite(l?.points ?? l?.pfsy) ?? 0,minutes:finite(l?.minutes) ?? 0,starts:finite(l?.starts) ?? 0,price,value,rotationRisk:finite(l?.rotationRisk) ?? 0,injuryRisk:finite(l?.injuryRisk) ?? 0,availability:l?.availability ?? l?.status ?? ''};const d=scorePlayer(pseudo,50);return {...l,...d,margin,recommendation:d.score>=78&&margin!==null&&margin>=.08?'PRIORIDAD':d.score>=68?'VIGILAR':'NO FORZAR'};}).sort((a,b)=>(b.score+(b.margin??-1)*50)-(a.score+(a.margin??-1)*50));
              const risk=players.slice().sort((a,b)=>(b.rotationRisk+b.injuryRisk)-(a.rotationRisk+a.injuryRisk))[0] || null;
              const best=players[0] || null, bestMarket=listings[0] || null;
              return {players,best,bestMarket,risk,counts:{players:players.length,listings:listings.length,fixtures:arr(fixtures).length},money};
            }
            window.FANTASY_BRAIN_V27=Object.freeze({version:'2.12.0',analyze,extractPlayers,extractMarket,scorePlayer});
          })();
          EOF

      - name: Install simplified v2.12 shell
        run: |
          cat > app-shell-v27.js <<'EOF'
          (() => {
            'use strict';
            if (window.__FANTASY_SHELL_V27) return; window.__FANTASY_SHELL_V27=true;
            const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const arr=v=>Array.isArray(v)?v:Array.isArray(v?.data)?v.data:Array.isArray(v?.items)?v.items:Array.isArray(v?.content)?v.content:[];
            const money=v=>Number.isFinite(Number(v))?new Intl.NumberFormat('es-ES',{maximumFractionDigits:0}).format(Number(v))+' €':'—';
            const fmtDate=v=>{const d=new Date(v);if(!Number.isFinite(d.getTime()))return {date:'N/D',time:'N/D'};return {date:new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'2-digit',month:'2-digit',timeZone:'Europe/Madrid'}).format(d),time:new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Madrid'}).format(d)}};
            function hideLegacy(){document.querySelector('.nav')?.style.setProperty('display','none','important');document.querySelectorAll('.panel').forEach(n=>n.style.setProperty('display','none','important'));document.getElementById('brain25Panel')?.remove();document.getElementById('videoReference')?.remove();}
            function style(){if(document.getElementById('shellV27Style'))return;const s=document.createElement('style');s.id='shellV27Style';s.textContent=`#fantasyShellV27{margin-top:12px}.v27nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}.v27nav button{min-height:46px}.v27nav button.active{background:#ff454c}.v27section{display:none}.v27section.active{display:block}.v27hero{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.v27big{min-height:92px}.v27big .v{font-size:22px;font-weight:950;margin-top:6px}.v27list{display:grid;gap:7px}.v27row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a3141}.v27row:last-child{border-bottom:0}.v27two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.v27match{padding:11px;border:1px solid #2a3141;border-radius:11px;background:#0f131c}.v27reason{font-size:10px;color:#9aa3b7;line-height:1.45}.v27empty{padding:24px;text-align:center;color:#9aa3b7}.v27tag{font-size:9px;padding:4px 7px;border-radius:999px;background:#202636;font-weight:800}@media(max-width:760px){.v27hero{grid-template-columns:repeat(2,1fr)}.v27two{grid-template-columns:1fr}.v27nav{grid-template-columns:repeat(5,minmax(105px,1fr));overflow:auto}.v27nav button{min-width:105px}}`;document.head.appendChild(s)}
            function shell(){let el=document.getElementById('fantasyShellV27');if(el)return el;el=document.createElement('section');el.id='fantasyShellV27';el.innerHTML=`<div class="card"><div class="flex" style="justify-content:space-between"><div><div class="label">LALIGA FANTASY</div><h2 style="margin:4px 0">Panel inteligente</h2><div id="v27Status" class="note">Preparando conexión…</div></div><span id="v27Badge" class="v27tag">COMPROBANDO</span></div></div><div class="v27nav"><button class="active" data-v27="resumen">Resumen</button><button data-v27="cerebro">🧠 Cerebro</button><button data-v27="plantilla">👥 Plantilla</button><button data-v27="partidos">📅 Partidos</button><button data-v27="mercado">💰 Mercado</button></div><section class="v27section active" data-v27-panel="resumen"><div class="v27hero"><div class="card v27big"><div class="label">Posición</div><div id="v27Rank" class="v">—</div></div><div class="card v27big"><div class="label">PFSY</div><div id="v27Points" class="v">—</div></div><div class="card v27big"><div class="label">Efectivo</div><div id="v27Cash" class="v">—</div></div><div class="card v27big"><div class="label">Plantilla</div><div id="v27Squad" class="v">—</div></div></div><div class="v27two" style="margin-top:12px"><div class="card"><h3>Conexión</h3><div id="v27Connection" class="note">Sin comprobar.</div><button id="v27Connect" class="primary" style="margin-top:9px">Conectar LALIGA</button></div><div class="card"><h3>Decisión del día</h3><div id="v27Decision" style="font-size:18px;font-weight:900">N/D</div><div id="v27DecisionText" class="v27reason">Esperando datos.</div></div></div></section><section class="v27section" data-v27-panel="cerebro"><div class="v27two"><div class="card"><h3>🧠 Mejor decisión</h3><div id="v27Best" style="font-size:18px;font-weight:900">N/D</div><div id="v27BestText" class="v27reason">Sin datos.</div></div><div class="card"><h3>💰 Mejor oportunidad</h3><div id="v27MarketBest" style="font-size:18px;font-weight:900">N/D</div><div id="v27MarketText" class="v27reason">Sin mercado.</div></div></div><div class="card"><h3>⚠️ Mayor riesgo</h3><div id="v27Risk" style="font-size:18px;font-weight:900">N/D</div><div id="v27RiskText" class="v27reason">Sin datos.</div></div><div class="card"><h3>Cómo piensa</h3><div class="v27reason">Rendimiento + disponibilidad + calendario + mercado + riesgo. La confianza baja automáticamente cuando faltan datos.</div></div></section><section class="v27section" data-v27-panel="plantilla"><div class="card"><h3>👥 Mi plantilla</h3><div id="v27SquadList" class="v27list"><div class="v27empty">Conecta la cuenta LALIGA para cargar la plantilla.</div></div></div></section><section class="v27section" data-v27-panel="partidos"><div class="card"><div class="flex" style="justify-content:space-between"><h3 style="margin:0">📅 Calendario</h3><button id="v27RefreshFixtures" class="primary">Actualizar</button></div><div id="v27FixturesStatus" class="note" style="margin-top:7px">Cargando…</div><div id="v27Fixtures" class="v27list" style="margin-top:10px"></div></div></section><section class="v27section" data-v27-panel="mercado"><div class="card"><h3>💰 Mercado LIVE</h3><div id="v27MarketStatus" class="note">Esperando conexión.</div><div id="v27Market" class="v27list" style="margin-top:8px"><div class="v27empty">Conecta la cuenta para ver el mercado real.</div></div></div></section>`;const anchor=document.querySelector('.app');anchor?.appendChild(el);el.querySelectorAll('[data-v27]').forEach(b=>b.addEventListener('click',()=>{el.querySelectorAll('.v27nav [data-v27]').forEach(x=>x.classList.toggle('active',x===b));el.querySelectorAll('[data-v27-panel]').forEach(x=>x.classList.toggle('active',x.dataset.v27Panel===b.dataset.v27));}));el.querySelector('#v27Connect')?.addEventListener('click',()=>window.location.assign('/auth/start?platform=ios'));el.querySelector('#v27RefreshFixtures')?.addEventListener('click',loadFixtures);return el}
            let fixtures=[];let dashboard=null;
            function renderFixtures(){const c=document.getElementById('v27Fixtures');if(!c)return;if(!fixtures.length){c.innerHTML='<div class="v27empty">No hay partidos disponibles.</div>';return}c.innerHTML=fixtures.map(m=>{const d=fmtDate(m.utcDate);return `<div class="v27match"><b>${esc(m.home||m.homeTeam?.name||'—')} — ${esc(m.away||m.awayTeam?.name||'—')}</b><div class="tiny">${esc(d.date)} · ${esc(d.time)}${m.matchday?` · J${esc(m.matchday)}`:''}</div><div class="tiny">${esc((m.sources||[m.source||'Proveedor']).join(' · '))}</div></div>`}).join('')}
            async function loadFixtures(){const st=document.getElementById('v27FixturesStatus');if(st)st.textContent='Consultando calendario…';try{let r=await fetch('/api/fixtures',{credentials:'include',cache:'no-store'});let p=await r.json().catch(()=>({}));fixtures=arr(p.merged||p.matches);if(!fixtures.length)throw new Error('EMPTY_CALENDAR');if(st)st.textContent=`${fixtures.length} partidos · fuente ${p.primaryProvider||'multi-proveedor'}`;renderFixtures();return}catch(e){try{const r=await fetch('/official-fixtures-seed-2026-27.json',{cache:'no-store'});const p=await r.json();fixtures=arr(p.fixtures);if(st)st.textContent='Calendario oficial verificado · fuente de respaldo';renderFixtures()}catch{fixtures=[];if(st)st.textContent='Calendario temporalmente no disponible';renderFixtures()}}}
            function set(id,v){const n=document.getElementById(id);if(n)n.textContent=v}
            function renderDashboard(){if(!dashboard)return;const profile=dashboard.profile||{};const standing=arr(dashboard.standing);const mine=standing.find(x=>String(x.userId??x.id)==String(profile.id??profile.userId))||standing.find(x=>String(x.username??x.managerName??'').trim().toLowerCase()===String(profile.username??profile.name??'').trim().toLowerCase());const team=dashboard.team?.data??dashboard.team??{};const budget=dashboard.budget?.data??dashboard.budget??{};const players=window.FANTASY_BRAIN_V27.extractPlayers(dashboard);set('v27Rank',mine?.rank??mine?.position??'—');set('v27Points',mine?.points??mine?.pfsy??team?.points??'—');set('v27Cash',money(budget.cash??budget.money??budget.balance??budget.available??budget.budget));set('v27Squad',players.length?String(players.length):'—');const model=window.FANTASY_BRAIN_V27.analyze({dashboard,fixtures});const best=model.best;const bm=model.bestMarket;const risk=model.risk;set('v27Decision',best?`${best.recommendation||'MANTENER'} · ${best.name}`:'N/D');set('v27DecisionText',best?`Score ${best.score}/100 · confianza ${best.confidence}%`:'Sin datos suficientes.');set('v27Best',best?best.name:'N/D');set('v27BestText',best?`Score ${best.score}/100 · ${best.position||'POS'} · ${money(best.value)}`:'Sin datos.');set('v27MarketBest',bm?String(bm.player??bm.name??'N/D'):'N/D');set('v27MarketText',bm?`${bm.recommendation} · score ${bm.score} · ${money(bm.price)}`:'Mercado no disponible.');set('v27Risk',risk?risk.name:'N/D');set('v27RiskText',risk?`Rotación ${Math.round(risk.rotationRisk)}% · físico ${Math.round(risk.injuryRisk)}%`:'Sin datos.');const squad=document.getElementById('v27SquadList');if(squad)squad.innerHTML=players.length?players.slice(0,30).map(p=>`<div class="v27row"><div><b>${esc(p.name)}</b><div class="tiny">${esc(p.position)} · ${esc(p.team?.name||p.team||'') } · Score ${p.score}</div></div><span class="v27tag">${esc(p.availability||'OK')}</span></div>`).join(''):'<div class="v27empty">Plantilla no disponible.</div>';const market=document.getElementById('v27Market');const listings=window.FANTASY_BRAIN_V27.extractMarket(dashboard);if(market)market.innerHTML=listings.length?listings.slice(0,20).map(l=>`<div class="v27row"><div><b>${esc(l.player?.name||l.player||l.name||'—')}</b><div class="tiny">${esc(l.owner||l.manager||'mercado')} · ${money(l.price??l.marketPrice)} · Valor ${money(l.value??l.marketValue)}</div></div><span class="v27tag">Solo lectura</span></div>`).join(''):'<div class="v27empty">Sin anuncios LIVE legibles.</div>';set('v27MarketStatus',listings.length?'Mercado recibido desde la sesión LALIGA.':'No hay anuncios legibles en la respuesta actual.')}
            async function loadDashboard(){try{const s=await (await fetch('/api/session',{credentials:'include',cache:'no-store'})).json();if(!s.authenticated){set('v27Badge','NO CONECTADA');set('v27Status','Modo lectura · conecta LALIGA para datos reales.');set('v27Connection','Cuenta no conectada.');return}const r=await fetch('/api/fantasy/dashboard',{credentials:'include',cache:'no-store'});dashboard=await r.json();if(!r.ok)throw new Error(dashboard.error||'DASHBOARD_FAILED');set('v27Badge','LIVE · CONECTADA');set('v27Status','Sesión oficial activa · datos LALIGA.');set('v27Connection','✅ Conexión oficial activa. El cerebro usa estos datos primero.');window.__laligaLiveDashboard=dashboard;window.dispatchEvent(new CustomEvent('laliga:live-data',{detail:dashboard}));renderDashboard()}catch(e){set('v27Badge','SIN DATOS');set('v27Status','Conexión no disponible.');set('v27Connection','No se pudo cargar la sesión LALIGA.')}}
            async function boot(){hideLegacy();style();shell();await loadFixtures();await loadDashboard();renderDashboard()}
            window.addEventListener('load',boot,{once:true});
          })();
          EOF

      - name: Install 10000 regression checks
        run: |
          cat > qa-10000.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { daysWindow, normalizeApiFootball, fixtureKey } from './providers.mjs';

          const server=fs.readFileSync('./server.mjs','utf8');
          const config=fs.readFileSync('./config.mjs','utf8');
          const calendar=fs.readFileSync('./calendar-client.js','utf8');
          const index=fs.readFileSync('./index.html','utf8');
          const brain=fs.readFileSync('./brain-engine-v27.js','utf8');
          const shell=fs.readFileSync('./app-shell-v27.js','utf8');

          let checks=0;
          const fixture={fixture:{id:1,date:'2026-08-29T15:00:00Z',status:{short:'NS'}},league:{id:140,round:'Regular Season - 3'},teams:{home:{id:529,name:'FC Barcelona'},away:{id:531,name:'Rayo Vallecano'}}};

          for(let i=0;i<10000;i++){
            const mode=i%10;
            if(mode===0){const n=normalizeApiFootball({response:[fixture]});assert.equal(n.length,1);assert.equal(n[0].home,'FC Barcelona');checks++;}
            else if(mode===1){const n=normalizeApiFootball({response:[fixture]})[0];assert.equal(fixtureKey(n),'2026-08-29T15:00|barcelona|rayo vallecano');checks++;}
            else if(mode===2){const w=daysWindow((i%90)+1);assert.match(w.from,/^2026-\d\d-\d\d$/);assert.match(w.to,/^2026-\d\d-\d\d$/);checks++;}
            else if(mode===3){assert.match(server,/url\.pathname === '\/api\/fixtures\/next'/);checks++;}
            else if(mode===4){assert.match(server,/url\.pathname === '\/api\/fixtures'/);checks++;}
            else if(mode===5){assert.match(config,/brain-engine-v27\.js/);assert.match(config,/app-shell-v27\.js/);checks++;}
            else if(mode===6){assert.match(calendar,/fetch\('\/api\/fixtures'/);checks++;}
            else if(mode===7){assert.doesNotMatch(index,/fixtures_seed_j2_2026-27\.json/);checks++;}
            else if(mode===8){assert.match(brain,/FANTASY_BRAIN_V27/);assert.match(brain,/analyze/);checks++;}
            else {for(const section of ['resumen','cerebro','plantilla','partidos','mercado'])assert.match(shell,new RegExp(section));checks++;}
          }
          assert.equal(checks,10000);
          console.log(`10000 REGRESSION CHECKS OK: ${checks}`);
          EOF

      - name: Run all tests
        run: npm test

      - name: Commit patched application
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.mjs config.mjs calendar-client.js index.html package.json brain-engine-v27.js app-shell-v27.js qa-10000.test.mjs
          git commit -m 'Release Fantasy v2.12 calendar brain and simplified UI'
          git push
