name: Project tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check config.mjs
          node --check providers.mjs
          node --check realdata.mjs
          node --check brain-engine.js
          node --check brain-engine-v25.js
          node --check dashboard-client.js
          node --check data-client.js
          node --check connection-client.js
          node --check auth-client.js
      - name: Run deterministic QA suite
        run: npm test
