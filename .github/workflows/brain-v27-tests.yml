name: Brain v2.7 tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Syntax and safety gate
        run: |
          node --check brain-core-v27.mjs
          node --check brain-host-v27.mjs
          node --check brain-client-v27.js
          node --check brain-history-v28.mjs
          node --check brain-history-hook-v28.mjs
          node --check brain-calibration-v28.mjs
          node --check brain-reliability-v29.mjs
          node --check brain-reliability-hook-v29.mjs
          node --check render-preflight.mjs
          node --check calendar-service-v29.mjs
          node --check calendar-autonomous-v30.js
          node --check focus-ui-v30.js
          node --check providers.mjs
          node --check config.mjs
          node --check server.mjs
          node --check brain-calibration-v28.test.mjs
          node --check brain-reliability-v29.test.mjs
          node --check render-preflight.test.mjs
          node --check calendar-v29.test.mjs
          node --check calendar-autonomous-v30.test.mjs
          node --check deployment-contract-v27.test.mjs
      - name: Deep brain regression
        run: node brain-v27.test.mjs
      - name: Runtime integration regression
        run: node brain-runtime-v27.test.mjs
      - name: Fuzz and recovery regression
        run: node brain-fuzz-v27.test.mjs
      - name: Historical memory regression
        run: node brain-history-v28.test.mjs
      - name: Confidence calibration regression
        run: node brain-calibration-v28.test.mjs
      - name: Reliability regression
        run: node brain-reliability-v29.test.mjs
      - name: Render preflight regression
        run: node render-preflight.test.mjs
      - name: Calendar source regression
        run: node calendar-v29.test.mjs
      - name: Autonomous calendar 10000-case regression
        run: node calendar-autonomous-v30.test.mjs
      - name: Deployment contract regression
        run: node deployment-contract-v27.test.mjs
