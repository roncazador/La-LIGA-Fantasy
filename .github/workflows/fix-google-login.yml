name: Fix Google LALIGA login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch social login and API base
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('config.mjs')
          s = p.read_text()
          s = s.replace("laligaApiBaseUrl: 'https://fantasy-api.llt-services.com',", "laligaApiBaseUrl: 'https://fantasy-api.llt-services.com/api',")
          s = s.replace("laligaAuthorizeUrl: String(env.LALIGA_AUTHORIZE_URL ?? '').trim(), laligaOAuthClientId: String(env.LALIGA_OAUTH_CLIENT_ID ?? '').trim(), laligaRedirectUri: String(env.LALIGA_REDIRECT_URI ?? '').trim(),", "laligaAuthorizeUrl: nonEmpty(env.LALIGA_AUTHORIZE_URL, 'https://login.laliga.es/laligadspprob2c.onmicrosoft.com/oauth2/v2.0/authorize'), laligaOAuthClientId: nonEmpty(env.LALIGA_OAUTH_CLIENT_ID, DEFAULTS.laligaPasswordClientId), laligaRedirectUri: nonEmpty(env.LALIGA_REDIRECT_URI, DEFAULTS.laligaPasswordRedirectUri),")
          p.write_text(s)
          p = Path('server.mjs')
          s = p.read_text()
          marker = "    if (url.pathname === '/api/providers/status' && req.method === 'GET') return sendJson(res,200,providerStatus(config));\n"
          block = '''    if (url.pathname === '/api/auth/google/start' && req.method === 'GET') {
      const state = crypto.randomBytes(32).toString('base64url');
      const verifier = crypto.randomBytes(64).toString('base64url');
      const challenge = crypto.createHash('sha256').update(verifier).digest('base64url');
      const sessionId = crypto.randomUUID();
      sessions.set(sessionId,{createdAt:Date.now(),state,verifier,platform:'web'});
      const query = new URLSearchParams({p:config.laligaSigninPolicy,client_id:config.laligaOAuthClientId,response_type:'code',redirect_uri:config.laligaRedirectUri,scope:'openid offline_access',code_challenge:challenge,code_challenge_method:'S256',state,nonce:state});
      return sendJson(res,200,{authorizeUrl:`${config.laligaAuthorizeUrl}?${query.toString()}`,redirectUri:config.laligaRedirectUri},{'Set-Cookie':cookieHeader(sessionId,900)});
    }
    if (url.pathname === '/api/auth/google/finish' && req.method === 'POST') {
      const session = getSession(req);
      if (!session?.state || !session?.verifier) return sendJson(res,400,{error:'GOOGLE_LOGIN_NOT_STARTED'});
      let body;
      try { body = JSON.parse(await readBody(req,12000)); } catch { return sendJson(res,400,{error:'INVALID_JSON'}); }
      const redirectUrl = typeof body?.redirectUrl === 'string' ? body.redirectUrl.trim() : '';
      if (!redirectUrl || !redirectUrl.startsWith('authredirect://com.lfp.laligafantasy')) return sendJson(res,400,{error:'INVALID_REDIRECT_URL'});
      let parsed;
      try { parsed = new URL(redirectUrl); } catch { return sendJson(res,400,{error:'INVALID_REDIRECT_URL'}); }
      const code = parsed.searchParams.get('code');
      const returnedState = parsed.searchParams.get('state');
      const providerError = parsed.searchParams.get('error');
      if (providerError) return sendJson(res,401,{error:'GOOGLE_AUTH_FAILED',detail:providerError});
      if (!code || returnedState !== session.state) return sendJson(res,400,{error:'INVALID_OIDC_CALLBACK'});
      try {
        const tokenUrl = `${config.laligaTokenUrl}?p=${encodeURIComponent(config.laligaSigninPolicy)}`;
        const tokenResponse = await fetch(tokenUrl,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',client_id:config.laligaOAuthClientId,code,redirect_uri:config.laligaRedirectUri,code_verifier:session.verifier,scope:'openid offline_access'}),cache:'no-store',signal:AbortSignal.timeout(12000)});
        const token = await tokenResponse.json().catch(() => ({}));
        if (!tokenResponse.ok || (!token.access_token && !token.id_token)) return sendJson(res,502,{error:'OIDC_TOKEN_EXCHANGE_FAILED'});
        session.accessToken=token.access_token || token.id_token;
        session.refreshToken=token.refresh_token || null;
        session.expiresAt=Date.now()+Number(token.expires_in || token.id_token_expires_in || 86400)*1000;
        session.createdAt=Date.now();
        session.authMethod='oidc-google';
        session.clientId=config.laligaOAuthClientId;
        session.policy=config.laligaSigninPolicy;
        delete session.state;
        delete session.verifier;
        return sendJson(res,200,{authenticated:true,authMethod:'oidc-google',expiresAt:session.expiresAt},{'Set-Cookie':cookieHeader(parseCookies(req)[config.sessionCookieName],2592000)});
      } catch { return sendJson(res,502,{error:'AUTHENTICATION_PROVIDER_UNAVAILABLE'}); }
    }
'''
          if "/api/auth/google/start" not in s:
              if marker not in s: raise SystemExit('server insertion marker not found')
              s = s.replace(marker, marker + block, 1)
          p.write_text(s)
          p = Path('connection-client.js')
          s = p.read_text()
          old = '''        <div id="ssoBoxV212" style="display:none">
          <button type="button" id="connectSSOV212" class="primary">🔑 Entrar con LALIGA / Google</button>
        </div>

        <form id="directLoginV212" style="margin-top:8px">
          <div style="font-size:11px;font-weight:800;margin-bottom:6px">Acceso con correo y contraseña</div>'''
          new = '''        <div id="ssoBoxV212">
          <button type="button" id="connectSSOV212" class="primary">🔑 Entrar con Google</button>
          <div id="googleHelpV212" class="tiny" style="margin-top:6px">Tu cuenta es de Google. LALIGA no usa una contraseña de Fantasy para estas cuentas.</div>
          <div id="googleFinishV212" style="display:none;margin-top:9px">
            <div class="tiny" style="margin-bottom:6px">Después de iniciar sesión en Google, pega aquí la URL que empieza por <b>authredirect://com.lfp.laligafantasy</b>. Solo contiene el código temporal de acceso.</div>
            <input id="googleRedirectV212" type="text" autocomplete="off" inputmode="url" placeholder="authredirect://com.lfp.laligafantasy?code=…&state=…" style="width:100%">
            <button type="button" id="finishGoogleV212" class="good" style="margin-top:7px">✅ Completar conexión</button>
          </div>
        </div>
        <form id="directLoginV212" style="margin-top:8px">
          <div style="font-size:11px;font-weight:800;margin-bottom:6px">Acceso con correo y contraseña (solo cuentas creadas con email)</div>'''
          if old not in s: raise SystemExit('connection panel marker not found')
          s = s.replace(old,new,1)
          s = s.replace("    byId('connectSSOV212')?.addEventListener('click', () => window.location.assign('/auth/start?platform=web'));", "    byId('connectSSOV212')?.addEventListener('click', startGoogle);\n    byId('finishGoogleV212')?.addEventListener('click', finishGoogle);")
          marker = "  async function getSession() {\n"
          funcs = '''  async function startGoogle() {
    const popup = window.open('about:blank', 'laligaGoogleLogin', 'width=520,height=760');
    setBadge('Preparando Google…', 'yellow'); setWarning('');
    try {
      const data = await getJson('/api/auth/google/start');
      if (popup) popup.location.href = data.authorizeUrl; else window.location.href = data.authorizeUrl;
      const box = byId('googleFinishV212'); if (box) box.style.display = 'block';
      setText('connectionDetailsV212', 'Se ha abierto el inicio de sesión oficial de LALIGA. Usa el mismo Google que utilizas en Fantasy.');
      setWarning('Si al terminar se intenta abrir la app de LALIGA y no puedes volver automáticamente, copia la URL authredirect://… y pégala abajo.');
    } catch (error) { try { popup?.close(); } catch {} setBadge('Error OAuth','red'); setWarning(`No se pudo preparar el acceso Google: ${error.message || 'error desconocido'}.`); }
  }
  async function finishGoogle() {
    const input = byId('googleRedirectV212'); const redirectUrl = String(input?.value || '').trim();
    if (!redirectUrl) return setWarning('Pega primero la URL authredirect://… que devuelve LALIGA.');
    setBadge('Validando Google…','yellow'); setWarning('');
    try {
      await getJson('/api/auth/google/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({redirectUrl})});
      if (input) input.value=''; setBadge('Conectada','good'); setLegacyConnectionState(true);
      setText('connectionDetailsV212','Cuenta Google de LALIGA autenticada. Descargando datos Fantasy reales…'); await syncOnce('google-login');
    } catch (error) { setBadge('No conectada','red'); const code=error?.data?.detail||error?.message||'error desconocido'; setWarning(code==='GOOGLE_AUTH_FAILED'?'Google/LALIGA rechazó el inicio de sesión.':`No se pudo completar la conexión Google (${code}). Si el código ha caducado, inicia el proceso de nuevo.`); }
  }
'''
          if 'async function startGoogle()' not in s:
              if marker not in s: raise SystemExit('connection function marker not found')
              s = s.replace(marker, funcs + marker, 1)
          s = s.replace("      setText('connectionDetailsV212', auth.configured ? 'OAuth oficial disponible o acceso directo con correo y contraseña.' : 'OAuth del navegador no está configurado; usa el acceso directo de LALIGA.');\n      if (!auth.configured) setWarning('El botón OAuth no está activo porque faltan parámetros OIDC. El acceso directo con correo/contraseña sí está preparado.');", "      setText('connectionDetailsV212', 'Inicio de sesión oficial de LALIGA preparado para cuentas Google.');\n      setWarning('Para una cuenta creada con Google debes usar el botón Entrar con Google; el formulario de contraseña no sirve para este tipo de cuenta.');")
          p.write_text(s)
          p = Path('qa.test.mjs')
          s = p.read_text()
          s = s.replace("check(DEFAULTS.laligaCompetitionId==='1','competición LALIGA');", "check(DEFAULTS.laligaCompetitionId==='1','competición LALIGA'); check(DEFAULTS.laligaApiBaseUrl.endsWith('/api'),'API Fantasy incluye /api');")
          s = s.replace("check(!oidcConfigured(readConfig({})),'OIDC no inventado');", "check(oidcConfigured(readConfig({})),'OIDC oficial por defecto');")
          s = s.replace("check(!serverSource.includes(\"case'buy'\"),'sin compra');", "check(serverSource.includes(\"/api/auth/google/start\"),'Google start route'); check(serverSource.includes(\"/api/auth/google/finish\"),'Google finish route'); check(!serverSource.includes(\"case'buy'\"),'sin compra');")
          p.write_text(s)
          wf = Path('.github/workflows/fix-google-login.yml')
          if wf.exists(): wf.unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.mjs server.mjs connection-client.js qa.test.mjs .github/workflows/fix-google-login.yml
          git commit -m 'Fix Google login and Fantasy API base' || exit 0
          git push
