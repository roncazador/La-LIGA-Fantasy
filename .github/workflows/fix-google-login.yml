name: Fix Google LALIGA login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/fix-google-login.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.mjs server.mjs connection-client.js qa.test.mjs .github/workflows/fix-google-login.yml .github/fix-google-login.py
          git commit -m 'Fix Google login and Fantasy API base' || exit 0
          git push
