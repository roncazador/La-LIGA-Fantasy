name: Calendar interface tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  calendar-interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Syntax checks
        run: |
          node --check calendar-client.js
          node --check data-client.js
          node --check dashboard-client.js
          node --check recording-client.js
      - name: Run 100 interface checks
        run: node calendar.test.mjs
