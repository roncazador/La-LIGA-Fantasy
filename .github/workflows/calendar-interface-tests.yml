name: Calendar interface tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  calendar-interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 100 interface checks
        run: node calendar.test.mjs
