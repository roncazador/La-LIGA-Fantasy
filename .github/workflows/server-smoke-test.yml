name: Server smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Start server
        run: |
          PORT=10000 HOST=127.0.0.1 NODE_ENV=test npm start > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/api/health > health.json; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Validate health response
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('health.json','utf8')); if(!x.ok || !x.readOnly) process.exit(1); console.log(x)"
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) 2>/dev/null || true
