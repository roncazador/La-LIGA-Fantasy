name: Maintenance automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: maintenance-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Syntax checks
        run: |
          node --check calendar-autonomous-v34.js
          node --check connection-client.js
          node --check match-detail-ui-v31.js
          node --check automation-contract-v1.test.mjs
      - name: Automation contract
        run: node automation-contract-v1.test.mjs
      - name: Render preflight
        run: npm run render:verify
