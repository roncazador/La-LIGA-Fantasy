name: Maintenance automation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  actions: read
  contents: read

concurrency:
  group: maintenance-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Syntax checks
        run: |
          node --check automation-hub-v1.js
          node --check calendar-autonomous-v35.js
          node --check app-dynamics-v37.js
          node --check connection-client.js
          node --check scripts/automation-battery-v2.mjs
          node --check scripts/automation-handoff-v1.mjs
          node --check scripts/assimilation-gate-v1.mjs
          node --check scripts/auto-correct-v1.mjs
          node --check scripts/performance-budget-v1.mjs
          node --check cultivos-v1.mjs
          node --check brain-host-v27.mjs
      - name: Deterministic auto-correction check
        run: npm run test:auto-correct
      - name: Performance budget
        run: npm run test:performance
      - name: Expanded automation battery
        run: npm run test:automation
      - name: Assimilation gate
        run: npm run test:assimilation
      - name: Render preflight
        run: npm run render:verify
      - name: Full project battery
        run: npm test
      - name: Generate ChatGPT handoff report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/automation-handoff-v1.mjs
      - name: Publish handoff summary
        if: always()
        run: |
          cat automation-handoff.md >> "$GITHUB_STEP_SUMMARY"
          if [[ -f performance-budget-report.json ]]; then cat performance-budget-report.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Package repository source
        if: always()
        run: git archive --format=zip --output=La-LIGA-Fantasy-${GITHUB_SHA}.zip HEAD
      - name: Upload automation reports and source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports-${{ github.sha }}
          path: |
            automation-battery-report.json
            automation-battery-report.md
            automation-handoff.json
            automation-handoff.md
            performance-budget-report.json
            assimilation-report.json
            La-LIGA-Fantasy-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
