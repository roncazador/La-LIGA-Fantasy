name: Self-healing AI

on:
  workflow_run:
    workflows:
      - Project tests
      - Brain v2.7 tests
      - Calendar interface tests
      - Recording UI contract tests
      - Real data tests
      - Server smoke test
      - Integrate LALIGA connection client
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: self-healing-ai-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source branch
        id: branch
        env:
          EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ -n "$EVENT_BRANCH" && "$EVENT_BRANCH" == self-heal/* ]]; then
            echo "branch=$EVENT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "branch=self-heal/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "sha=${EVENT_SHA:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failing revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.sha }}
          fetch-depth: 0

      - name: Prepare repair branch
        env:
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          SOURCE_SHA: ${{ steps.branch.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "laliga-self-healing[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          if git ls-remote --exit-code --heads origin "$REPAIR_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$REPAIR_BRANCH":"refs/remotes/origin/$REPAIR_BRANCH" --depth=50
            git checkout -B "$REPAIR_BRANCH" "refs/remotes/origin/$REPAIR_BRANCH"
          else
            git checkout -B "$REPAIR_BRANCH" "$SOURCE_SHA"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Generate ChatGPT handoff
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ steps.branch.outputs.sha }}
        run: node scripts/automation-handoff-v1.mjs

      - name: Upload ChatGPT handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-chatgpt-handoff
          path: |
            automation-handoff.json
            automation-handoff.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Deterministic auto-correction
        id: autocorrect
        run: |
          set -euo pipefail
          node scripts/auto-correct-v1.mjs --write
          if [[ -n "$(git status --porcelain)" ]]; then
            npm test
            git diff --check
            git add automation-contract-v1.test.mjs config.mjs connection-client.js sw.js
            git commit -m "fix(self-heal): apply deterministic corrections"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run self-healing agent
        if: steps.autocorrect.outputs.changed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          SELF_HEAL_MAX_ATTEMPTS: 2
        run: node scripts/self-heal-agent.mjs

      - name: Push repair branch
        id: push
        env:
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$REPAIR_BRANCH":"refs/remotes/origin/$REPAIR_BRANCH" --depth=1 || true
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse "refs/remotes/origin/$REPAIR_BRANCH" 2>/dev/null || true)
          if [[ -n "$REMOTE_SHA" && "$LOCAL_SHA" == "$REMOTE_SHA" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push --force-with-lease origin "HEAD:$REPAIR_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update repair PR
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPAIR_BRANCH: ${{ steps.branch.outputs.branch }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || 'manual' }}
        run: |
          set -euo pipefail
          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REPAIR_BRANCH" --state open --json number --jq '.[0].number' || true)
          BODY=$(cat <<EOF
          ## Self-healing AI repair

          This PR was generated from a failed GitHub Actions run and contains a bounded repair proposed by the repository's self-healing system.

          **Source workflow:** $WORKFLOW_NAME
          **Repair branch:** $REPAIR_BRANCH
          **Diagnostic handoff:** attached as workflow artifact `self-healing-chatgpt-handoff`.

          Deterministic safe corrections run before AI repair. Any committed repair must pass the full `npm test` suite and repository policy checks. Automatic self-merge remains disabled.
          EOF
          )
          if [[ -n "$EXISTING" ]]; then
            gh pr comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$REPAIR_BRANCH" --title "fix(self-heal): repair $WORKFLOW_NAME" --body "$BODY"
          fi

      - name: Report no repair
        if: steps.push.outputs.changed != 'true'
        run: echo "Self-healing system produced no new validated repair."
