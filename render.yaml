services:
  - type: web
    name: laliga-fantasy-manager
    runtime: node
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm install --no-audit --no-fund && npm run render:verify
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    disk:
      name: fantasy-brain-data
      mountPath: /var/data/brain
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: LALIGA_API_BASE_URL
        value: https://fantasy-api.llt-services.com/api
      - key: LALIGA_COMPETITION_ID
        value: "1"
      - key: SESSION_COOKIE_NAME
        value: fm_session
      - key: AUTOMATION_ENABLED
        value: "true"
      - key: CULTIVOS_ENABLED
        value: "true"
      - key: AI_FEEDBACK_ENABLED
        value: "false"
      - key: AI_FEEDBACK_MODEL
        value: ""
      # Secret credentials are deliberately not committed. Render requires their
      # values to be supplied in the Dashboard; existing Blueprints ignore sync:false
      # on later syncs, so add/rotate these values manually when a provider is enabled.
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: SPORTMONKS_API_TOKEN
        sync: false
      - key: API_FOOTBALL_API_KEY
        sync: false
      - key: OPTA_API_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BRAIN_STATE_DIR
        value: /var/data/brain
