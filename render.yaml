services:
  - type: web
    name: laliga-fantasy-manager
    runtime: node
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm install --no-audit --no-fund && npm run render:verify
    startCommand: npm start
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: LALIGA_API_BASE_URL
        value: https://fantasy-api.llt-services.com
      - key: LALIGA_COMPETITION_ID
        value: "1"
      - key: SESSION_COOKIE_NAME
        value: fm_session
      # Persist model/history/cache here when a Render persistent disk is attached.
      # Without a persistent disk the service remains functional, but learned state is ephemeral.
      - key: BRAIN_STATE_DIR
        value: /var/data/brain
